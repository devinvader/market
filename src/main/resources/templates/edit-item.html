<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Редактирование товара</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
    <div class="container p-2">
        <div class="row p-2">
            <div class="col">
                <div class="hstack gap-3">
                    <h2>
                        <span class="badge text-bg-success">Редактирование товара</span>
                    </h2>
                    <a href="/admin" class="btn btn-secondary ms-auto bi bi-arrow-left-square"> Назад к списку</a>
                </div>
            </div>
        </div>
        <div class="row p-2">
            <div class="col">
                <div class="card">
                    <div class="card-body">
                        <form th:action="@{${'/admin/items/'+item.id()}}" method="post" enctype="multipart/form-data" th:object="${item}">
                            <div class="mb-3">
                                <label for="title" class="form-label">Название</label>
                                <input type="text" class="form-control" id="title" th:field="*{title}" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Описание</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="imageFile" class="form-label">Изображение товара</label>
                                <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*">
                                <div class="form-text">Загрузите новое изображение, чтобы заменить текущее. Оставьте пустым, чтобы оставить текущее.</div>
                                <div class="mt-2">
                                    <span>Текущее изображение:</span>
                                    <img th:src="@{${'/items/'+item.id()+'/image'}}" alt="Нет изображения" width="100" height="100" class="mt-2" onerror="this.style.display='none'">
                                    <span th:if="${item.imgPath() == null || item.imgPath().isEmpty()}">Нет изображения</span>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="price" class="form-label">Цена (в руб.)</label>
                                <input type="number" class="form-control" id="price" th:field="*{price}" min="0" step="1" required>
                            </div>
                            <div class="hstack gap-3">
                                <button type="submit" class="btn btn-success bi bi-check-circle"> Сохранить</button>
                                <a th:href="@{/admin}" class="btn btn-outline-secondary">Отмена</a>
                                <button type="button" class="btn btn-danger ms-auto bi bi-trash" data-bs-toggle="modal" data-bs-target="#deleteModal"> Удалить товар</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal для подтверждения удаления -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Подтверждение удаления</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Вы уверены, что хотите удалить этот товар? Это действие нельзя отменить.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <form th:action="@{${'/admin/items/'+item.id()+'/delete'}}" method="post">
                        <button type="submit" class="btn btn-danger">Удалить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>

</html>
